[project]
name = "bookpolish"
version = "0.1.0"
description = "Context-aware copy editor for machine-translated fiction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joel Sunil" }]
dependencies = []

[project.scripts]
bookpolish = "bookpolish.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bookpolish*"]
